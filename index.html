    <script>
      // Reveal animations are opt-IN, never opt-out: content is visible by default in CSS,
      // and this flag is the only thing that hides it before animating. If JavaScript is
      // disabled, IntersectionObserver is missing, or the visitor prefers reduced motion,
      // the flag is never set and every element simply renders. See src/index.css.
      (function () {
        try {
          var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!reduced && 'IntersectionObserver' in window) {
            document.documentElement.classList.add('reveal-enabled');
          }
        } catch (e) {
          /* leave content visible */
        }
      })();
    </script>
